name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:latest   # Debian-based, latest stable Rust toolchain
    steps:
    - uses: actions/checkout@v5
    - name: Show toolchain
      run: rustc --version && cargo --version
    - name: Build
      run: cargo build
    - name: Run tests
      run: cargo test
